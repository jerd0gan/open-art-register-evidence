name: OAR public database status

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

concurrency:
  group: oar-public-database-status
  cancel-in-progress: false

jobs:
  public-health:
    name: Public database status
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout public demo repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify public repository boundary
        run: npm test
      - name: Check public database health
        run: node scripts/public-health-check.mjs
